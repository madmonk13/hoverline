<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16245e"/>
      <stop offset="1" stop-color="#070a1c"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#39e6ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- track lines converging to the horizon -->
  <path d="M20 512 L234 200 M492 512 L278 200" stroke="#ff4fd8" stroke-width="10" opacity=".75"/>
  <path d="M256 400 V430 M256 462 V512" stroke="#ffffff" stroke-width="8" opacity=".45"/>
  <!-- twin-pod racer seen from behind -->
  <g transform="translate(256 286) scale(1.2)">
    <ellipse cx="0" cy="62" rx="150" ry="18" fill="#000" opacity=".35"/>
    <path d="M-150 18 L-40 -12 L40 -12 L150 18 L40 30 L-40 30 Z" fill="#0b4f6c"/>
    <path d="M-40 -12 L0 -78 L40 -12 L28 34 L-28 34 Z" fill="url(#hull)"/>
    <rect x="-118" y="-20" width="44" height="64" rx="20" fill="url(#hull)"/>
    <rect x="74" y="-20" width="44" height="64" rx="20" fill="url(#hull)"/>
    <ellipse cx="0" cy="-30" rx="13" ry="22" fill="#070a1c"/>
    <circle cx="-96" cy="34" r="15" fill="#ffffff"/>
    <circle cx="96" cy="34" r="15" fill="#ffffff"/>
    <circle cx="-96" cy="34" r="30" fill="#39e6ff" opacity=".35"/>
    <circle cx="96" cy="34" r="30" fill="#39e6ff" opacity=".35"/>
  </g>
</svg>
